<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f15">
  <title>Desk Dash — Capo Systems</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">D<span></span></span><div><b>DESK DASH</b><small>CAPO SYSTEMS <i> / </i> 01</small></div></div>
      <div class="nav-label">WORKSPACE</div>
      <nav id="nav" aria-label="Dashboard pages">
        <button data-page="overview" class="active"><span class="nav-symbol">◈</span> Overview</button>
        <button data-page="systems"><span class="nav-symbol">▤</span> Systems</button>
        <button data-page="storage"><span class="nav-symbol">▥</span> Storage</button>
        <button data-page="websites"><span class="nav-symbol">◎</span> Websites</button>
        <button data-page="services"><span class="nav-symbol">▦</span> Services</button>
        <button data-page="network"><span class="nav-symbol">⌁</span> Network</button>
        <button data-page="activity"><span class="nav-symbol">≡</span> Activity</button>
        <button data-page="controls"><span class="nav-symbol">⌘</span> Controls</button>
      </nav>
      <div class="side-bottom"><div class="pulse-dot"></div><div><strong>LOCAL MONITORING</strong><small id="side-time">Synchronizing…</small></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="breadcrumbs">CAPO SYSTEMS <span>/</span> <b id="breadcrumb">OVERVIEW</b></div><div class="top-actions"><span id="sync-badge" class="sync-badge">CONNECTING</span><span id="clock" class="clock"></span><button id="logout" class="link-button hidden">Sign out</button></div></header>
      <div id="content" class="content" aria-live="polite"></div>
    </main>
  </div>
  <div id="login" class="overlay hidden"><form id="login-form" class="dialog login-card"><div class="brand-mark large">D<span></span></div><div class="eyebrow">CAPO SYSTEMS / ACCESS</div><h2>Welcome back.</h2><p>Enter your dashboard password to view live systems.</p><label for="password">Dashboard password</label><input type="password" id="password" autocomplete="current-password" required><p id="login-error" class="form-error"></p><button class="button primary" type="submit">Unlock dashboard <span>→</span></button></form></div>
  <div id="confirm" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><div class="dialog"><div class="eyebrow">ACTION CONFIRMATION</div><h2 id="confirm-title"></h2><p id="confirm-detail"></p><div class="dialog-actions"><button id="cancel-action" class="button subtle">Cancel</button><button id="execute-action" class="button danger">Confirm action</button></div></div></div>
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
